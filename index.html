<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="./atv10desafio/desafio.css">
    <script src="login_desafio.js"></script>
</head>
<body clas="login-page">

    <main class="login-container">
        <div class="logo">✅</div>

        <h1>bem-vindo meu amigo</h1>
        <p class="subtitulo">Entre aqui</p>

        <form id="formlogin">
            <div class="campo">
                <label for="usuario">usuario</label>
                <input type="text" id="usuario" placeholder="digite seu user">
            </div>

            <div class="campo">
                <label for="senha">senha</label>
                <input type="password" id="senha" placeholder="digite sua senha">
            </div>

            <p id="mensagemErro" class="mansagem-erro"></p>

            <button type="submit" class="botao-enviar">Entre no sistem sistema</button>

        </form>

        <p class="rodape">Sistema de cadrasto de cliente</p>
    </main
</body>
</html>
